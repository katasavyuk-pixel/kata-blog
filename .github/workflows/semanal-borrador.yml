# Weekly edition — open the draft's pull request.
#
# Thursday morning: `npm run semanal` gathers the week's daily editions, the
# lead articles and the build log into content/newsletters/<AAAA-sNN>.md with
# `draft: true` (scripts/radar/weekly-draft.ts, no model involved), and this job
# opens a PR with it. Kata writes «Lo importante» (or asks for it from his phone),
# approves, merges and sends from /panel. Nothing here
# sends, and nothing here ever touches a file that already exists.
#
# Safe to repeat: no PR while one from this job is still open, none when this
# week's edition is already on main, and the job fails if it changed anything
# except one new edition.
name: Semanal — borrador

on:
  schedule:
    # Off the top of the hour (GitHub delays those the most).
    - cron: "17 6 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semanal-borrador
  cancel-in-progress: false

jobs:
  borrador:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A draft that waits for review is not written again, and its branch is not
      # force-pushed over whatever Kata added to it (same guard as youtube-nuevo.yml).
      - name: Look for an open draft
        id: abierto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          abierto=$(gh pr list --state open --limit 100 --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("semanal/"))][0].number // empty')
          if [ -n "$abierto" ]; then
            echo "::notice title=Semanal::Ya hay un borrador esperando revisión (#$abierto): no se escribe otro."
          fi
          echo "numero=$abierto" >> "$GITHUB_OUTPUT"

      - name: Build content
        if: steps.abierto.outputs.numero == ''
        run: npm run build:content

      - name: Write the draft
        id: borrador
        if: steps.abierto.outputs.numero == ''
        run: |
          set +e
          npm run semanal 2>&1 | tee "$RUNNER_TEMP/semanal.log"
          codigo=${PIPESTATUS[0]}
          set -e
          if [ "$codigo" -ne 0 ]; then
            # The script refuses, on purpose, to touch an edition that already
            # exists (a draft being worked on, or one already approved). That is
            # a quiet week for this job, not a failure; anything else is.
            if grep -qE 'ya existe|ya no es un borrador' "$RUNNER_TEMP/semanal.log"; then
              echo "::notice title=Semanal::La edición de esta semana ya existe: no se toca."
              echo "id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$codigo"
          fi
          nuevo=$(git status --porcelain)
          if [ "$(printf '%s\n' "$nuevo" | wc -l)" -ne 1 ] || ! printf '%s' "$nuevo" | grep -qE '^\?\? content/newsletters/[0-9]{4}-s[0-9]{2}\.md$'; then
            echo "::error title=Semanal::Se esperaba una sola edición nueva y hay otra cosa:"
            echo "$nuevo"
            exit 1
          fi
          fichero=$(printf '%s\n' "$nuevo" | sed 's/^?? //')
          id=$(basename "$fichero" .md)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "fichero=$fichero" >> "$GITHUB_OUTPUT"

      # The PR will not get ci.yml (a PR opened with GITHUB_TOKEN triggers no
      # workflows), so the checks run here, before anyone is asked to look.
      - name: Verify and build
        if: steps.borrador.outputs.id != ''
        run: npm run verify && npm run build

      - name: Open PR
        if: steps.borrador.outputs.id != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: semanal/${{ steps.borrador.outputs.id }}
          add-paths: content/newsletters/
          commit-message: "content(newsletter): borrador de la semanal ${{ steps.borrador.outputs.id }}"
          title: "📰 Semanal ${{ steps.borrador.outputs.id }}: borrador para revisar"
          body: |
            Borrador de la edición semanal `${{ steps.borrador.outputs.id }}`, escrito por `npm run semanal` (sin modelo): el material de la semana, ordenado.
            Queda en `draft: true`, con bloques `{{…}}` que solo puedes escribir tú; mientras quede uno, el envío falla a propósito.

            **Qué falta**
            - [ ] **Lo importante de esta semana** — tuyo, dos o tres párrafos. Desde el móvil: pide a Claude *«escribe Lo importante de la semanal»* sobre esta rama (`.claude/skills/publicar`).
            - [ ] **Asunto con emoji delante** (🎁 regalo · 🛠️ montado · ⚠️ se rompió · 📰 noticia): `tests/asuntos.test.ts` lo exige al aprobarla. Antetítulo y pregunta.
            - [ ] Leer cada titular contra su fuente y el checklist de voz y límites.
            - [ ] Imágenes del correo: `npm run build:content && npm run correo` (en el Mac).
            - [ ] Aprobar (quitar `draft: true`), fusionar y enviar desde `/panel` (ensayo primero; después `sent: true`).

            **Sobre las comprobaciones.** Una PR abierta con `GITHUB_TOKEN` **no dispara `ci.yml`**: por eso este workflow ya ha pasado `npm run verify` y `npm run build` antes de abrirla. Si quieres el CI de siempre en esta PR, ciérrala y vuélvela a abrir, o empuja un commit tuyo (con tu cuenta de GitHub, para que Vercel lo despliegue).

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
